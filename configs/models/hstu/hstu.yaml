config_version: hstu_style_public_v3_dlrm_target_aware_mlp_head_native160_action_adamw
config_kind: model
data_config: ../../data/small.yaml
training_config: ../../../configs/train/adamw.yaml
model:
  name: hstu
  class_path: models.hstu.model:HSTUStyleModel
  feature: v1
  features: {use: all}
  embedding:
    default_dim: 32
    namespace_overrides: {"45040": 256}
  params:
    history:
      group: history_group_1
      action_slot: 45040
      timestamp_slot: 45042
      time_gap_slot: 45073
      padding_side: left
      direct_validation: strict
    model_dim: 256
    num_heads: 4
    attention_dim: 64
    value_dim: 64
    num_layers: 4
    dropout: 0.0
    attention_normalization: token_count
    position_bucket_count: 202
    time_bucket_count: 128
    time_bucket_transform: log1p
    history_tokenization: content_action_projected_sum
    position_time_encoding: additive_once
    candidate_position_mode: shared_target
    candidate_isolation: true
    output_label_names: [click, atc, order]
    head_type: mlp
    head_hidden_dim: 256
    head_dropout: 0.0
    point_loss_weight: 1.0
    list_loss_weight: 0.0
    task_loss_weights: {click: 1.0, atc: 1.0, order: 1.0}
    torchrec:
      mode: dmp
      sparse_optimizer: {name: exact_adagrad, lr: 0.01, eps: 1.0e-8, weight_decay: 0.0}
      storage:
        default_compute_kernel: fused
        default_sharding_types: [table_wise]
        capacity_rules:
          - min_vocab_size_exclusive: 100000
            sharding_types: [row_wise]
