config_version: infnet_native160_negmask_adamw_v1
config_kind: model
data_config: ../../data/small.yaml
training_config: ../../../configs/train/adamw_negmask.yaml
model:
  name: infnet
  class_path: models.infnet.model:INFNetModel
  feature: v1
  features:
    use: all
    mapped_id_slots: [45040]
  embedding:
    default_dim: 32
    namespace_overrides: {"45040": 256}
  params:
    history:
      group: history_group_1
      action_slot: 45040
      timestamp_slot: 45042
      time_gap_slot: 45073
      padding_side: left
      action_ids: {click: 3, atc: 4, order: 2}
    categorical_input_dim: 32
    token_dim: 64
    num_categorical_hubs: 4
    num_shared_task_hubs: 2
    num_layers: 3
    expansion_factor: 2
    dropout: 0.0
    norm_eps: 1.0e-6
    candidate_isolation: true
    candidate_chunk_size: 1
    task_names: [click, atc, order]
    tower_hidden_units: [128, 64]
    tower_dropout: 0.0
    task_weights: {click: 1.0, atc: 1.0, order: 1.0}
    torchrec:
      mode: dmp
      sparse_optimizer:
        name: exact_adagrad
        lr: 0.01
        eps: 1.0e-8
        weight_decay: 0.0
      storage:
        default_compute_kernel: fused
        default_sharding_types: [table_wise]
        capacity_rules:
          - min_vocab_size_exclusive: 100000
            sharding_types: [row_wise]
