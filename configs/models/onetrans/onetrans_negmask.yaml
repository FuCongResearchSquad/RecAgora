config_version: onetrans_v1_3_a12_d8_action_adamw
config_kind: model
data_config: ../../data/small.yaml
training_config: ../../../configs/train/adamw_negmask.yaml
model:
  name: onetrans
  class_path: models.onetrans.model:OneTransModel
  feature: v1
  features: {use: all}
  embedding:
    default_dim: 32
    namespace_overrides: {"45040": 256}
  params:
    history:
      group: history_group_1
      sequence_slots: [45041, 45043, 45040, 45044, 45045, 45046, 45047, 45048, 45049, 45051, 45075, 45054, 45055, 45056, 45057, 45058, 45059, 45060, 45061, 45062, 45063, 45064, 45066, 45067, 45068, 45069, 45070, 45072]
      length_slot: 45041
      action_slot: 45040
      timestamp_slot: 45042
      time_gap_slot: 45073
      padding_side: left
      time_gap_transform: log1p
      time_gap_dim: 16
      runtime_validation: shapes_only
    tokenizer:
      type: auto_split
      token_count: 12
      token_order: [query_semantic_entity, query_statistics, target_identity_taxonomy, target_content_context, target_commerce_quality, target_price_status, target_item_search_funnel, target_query_item_funnel, target_query_relevance, target_behavior_recency, target_behavior_counts, target_personalization]
