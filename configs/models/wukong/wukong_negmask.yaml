config_version: wukong_arch_core_paper_shaped_native160_negmask_adamw_v1
config_kind: model
data_config: ../../data/small.yaml
training_config: ../../../configs/train/adamw_negmask.yaml
model:
  name: wukong
  class_path: models.wukong.model:WukongModel
  feature: v1
  features:
    use: all
    exclude: [45042, 45073]
  embedding:
    default_dim: 32
    namespace_overrides: {"45040": 256}
  params:
    history_group_name: history_group_1
    action_slot: 45040
    interaction_dim: 128
    num_layers: 4
    projection_rank: 24
    fmb_output_tokens: 16
    lcb_output_tokens: 16
    fmb_hidden_units: [2048, 2048, 2048]
    lcb_dropout: 0.0
    activation_checkpointing: true
    candidate_chunk_size: 2
    candidate_isolation: true
    task_names: [click, atc, order]
    head_hidden_units: [512, 256]
    head_dropout: 0.0
    task_weights: {click: 1.0, atc: 1.0, order: 1.0}
    torchrec:
      mode: dmp
      sparse_optimizer: {name: exact_adagrad, lr: 0.01, eps: 1.0e-8, weight_decay: 0.0}
      storage:
        default_compute_kernel: fused
        default_sharding_types: [table_wise]
        capacity_rules:
          - min_vocab_size_exclusive: 100000
            sharding_types: [row_wise]
